name: Jekyll Build & Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build

      - name: Check HTML (internal links & markup)
        run: |
          bundle exec htmlproofer ./_site \
            --check-html \
            --disable-external \
            --allow-hash-href \
            --ignore-empty-alt \
            --ignore-status-codes "0,403,429"
