<ul class="dir-tree">
{%- for section in site.data.navigation -%}
    <li>
        <button class="tree-item js-tree-toggle"
                data-group="{{ section.id | default: forloop.index }}"
                aria-expanded="false"
                aria-label="展开/折叠 {{ section.title }}">
            <span class="tree-toggle" aria-hidden="true">▶</span>
            <span class="tree-icon" aria-hidden="true">{{ section.icon }}</span>
            <span class="tree-label">{{ section.title }}</span>
        </button>
        <ul class="tree-children">
        {%- for item in section.children -%}
            <li><a class="tree-item" href="{{ item.url | relative_url }}"><span class="tree-icon" aria-hidden="true">{{ item.icon }}</span><span class="tree-label">{{ item.title }}</span></a></li>
        {%- endfor -%}
        </ul>
    </li>
{%- endfor -%}
</ul>
