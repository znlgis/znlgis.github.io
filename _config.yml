# 站点配置
title: znlgis 博客
description: GIS开发与技术分享
author: znlgis
baseurl: ""
url: "https://znlgis.github.io"

# 主题配置
markdown: kramdown
highlighter: rouge

# 构建优化
incremental: true
quiet: true

# Kramdown 配置
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# 排除文件
exclude:
  - README.md
  - LICENSE
  - .gitignore
  - gis/basic/pom
  - vendor
  - .bundle
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json

# 集合配置
collections:
  posts:
    output: true
    permalink: /:title/

# 性能优化
# 注意: safe 模式在 GitHub Pages 上默认启用，本地开发时可能需要禁用以使用自定义插件
# safe: true  
profile: false
lsi: false

# 默认值
defaults:
  - scope:
      path: ""
    values:
      layout: default
