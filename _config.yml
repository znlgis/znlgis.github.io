# 站点配置
title: znlgis 博客
description: GIS开发与技术分享 — GDAL · GeoServer · PostGIS · QGIS · OpenLayers · Cesium · FreeCAD · NPOI
author: znlgis
baseurl: ""
url: "https://znlgis.github.io"

# SEO
keywords: GIS,GDAL,GeoServer,PostGIS,QGIS,OpenLayers,Cesium,FreeCAD,OCCT,NPOI,C#,CAD,3D,AI,地图开发,空间数据,地理信息系统

# 主题配置
markdown: kramdown
highlighter: rouge

# Jekyll 插件
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# 构建优化
incremental: true
quiet: true

# Kramdown 配置
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# 排除文件
exclude:
  - README.md
  - LICENSE
  - .gitignore
  - gis/basic/pom
  - vendor
  - .bundle
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json

# 集合配置
collections:
  posts:
    output: true
    permalink: /:title/

# GitHub Pages 安全模式
profile: false
lsi: false

# 默认值
defaults:
  - scope:
      path: ""
    values:
      layout: default
